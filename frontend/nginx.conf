server {
    listen 80;

    # ROUTE 1: The Storefront
    # If a user just visits the website, serve the React HTML files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ROUTE 2: The API
    # If the URL contains "/api/", strip the "/api/" part and forward it to Python
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}